spring.application.name=FindIt
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/findit_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=always
server.port=${SERVER_PORT:8081}
findit.upload-dir=${UPLOAD_DIR:uploads}
