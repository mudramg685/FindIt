<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join FindIt</title><link rel="stylesheet" href="/style.css"></head><body class="auth-page"><a class="brand auth-brand" href="/"><span class="brand-icon">f</span> FindIt</a><main class="auth-wrap"><div class="auth-intro"><span class="eyebrow">A LITTLE CAMPUS MAGIC</span><h1>Let’s get<br>you connected.</h1><p>Create your free campus account. It takes less than a minute, promise.</p><div class="mini-quote">Your email and contact details stay private. Messages go through FindIt.</div></div><form class="panel auth-form" id="registerForm"><h2>Create account</h2><p class="muted">Join your campus community.</p><label>Full name<input required name="name" placeholder="Alex Morgan" maxlength="100"></label><label>Campus email<input required type="email" name="email" placeholder="you@campus.edu"></label><label>Department<input required name="department" placeholder="Computer Science"></label><label>Password<input required type="password" name="password" minlength="8" placeholder="At least 8 characters"></label><div id="notice" class="notice hidden"></div><button class="button full">Create my account <span>→</span></button><p class="form-foot">Already have an account? <a href="/login.html">Log in</a></p></form></main><script src="/script.js"></script></body></html>
