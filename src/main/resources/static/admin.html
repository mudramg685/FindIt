<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · FindIt</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/browse"><span class="brand-icon">f</span> FindIt</a><nav><a href="/browse">Browse items</a><a href="/dashboard.html">My dashboard</a><button class="link" data-logout>Log out</button></nav></header><main class="dashboard"><span class="eyebrow">CAMPUS MODERATION</span><h1>Admin dashboard</h1><p class="muted">Review reported items and campus accounts.</p><div id="adminNotice" class="notice hidden"></div><h2>All reported items</h2><div class="item-grid" id="adminItems"></div><h2 style="margin-top:40px">Registered students</h2><div class="message-list" id="adminUsers"></div></main><script src="/script.js"></script><script>
(async()=>{try{const me=await api('/api/auth/me');if(me.role!=='ADMIN')throw Error('Administrator access required.');const [items,users]=await Promise.all([api('/api/items'),api('/api/admin/users')]);document.querySelector('#adminItems').innerHTML=items.length?items.map(i=>card(i,true)).join(''):'<p class="muted">No reported items.</p>';document.querySelector('#adminUsers').innerHTML=users.map(u=>`<article class="message-card"><b>${esc(u.name)}</b> · ${esc(u.department)}<br><small>${esc(u.email)} · ${esc(u.role)}</small></article>`).join('')}catch(e){if(e.message.includes('log in'))location.href='/login.html';else{const n=document.querySelector('#adminNotice');n.textContent=e.message;n.classList.remove('hidden');n.classList.add('error')}}})();
</script></body></html>
