<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an item · FindIt</title><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><a class="brand" href="/"><span class="brand-icon">f</span> FindIt</a><nav><a href="/">Browse items</a><a href="/dashboard.html">Dashboard</a><button class="link" data-logout>Log out</button></nav></header><main class="form-page"><a class="back" href="/">← Back to all items</a><span class="eyebrow">HELP YOUR CAMPUS</span><h1>Let’s get it <em>back out there.</em></h1><p class="muted">A few details can help someone find what they’re looking for.</p><form class="panel report-form" id="reportForm"><div class="toggle-row"><label><input type="radio" name="type" value="LOST" checked><span>🔍 &nbsp;I lost something</span></label><label data-found-choice><input type="radio" name="type" value="FOUND"><span>✦ &nbsp;Staff found an item</span></label></div><div class="form-columns"><label>Item name<input required name="name" maxlength="120" placeholder="e.g. Blue Hydro Flask"></label><label>Category<select required name="category"><option value="">Choose a category</option><option>Electronics</option><option>Accessories</option><option>Books & Notes</option><option>Clothing</option><option>Keys & Cards</option><option>Other</option></select></label><label class="wide">Description<textarea required name="description" maxlength="2000" rows="4" placeholder="Color, brand, stickers, or anything that makes it recognizable"></textarea></label><label>Location<input required name="location" placeholder="e.g. Student Union, 2nd floor"></label><label>Date lost / found<input required name="itemDate" type="date"></label><label class="wide photo-field">Add a photo <span class="muted">(optional · JPG, PNG, WEBP or GIF · max 5 MB)</span><input id="itemPhoto" type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif"><span class="photo-help">Choose a clear photo of the item. Max size: 5 MB.</span><span id="photoName" class="photo-name hidden"></span><img id="photoPreview" class="photo-preview hidden" alt="Selected item photo preview"></label></div><div id="notice" class="notice hidden"></div><button class="button">Post to campus <span>↗</span></button></form></main><script src="/script.js"></script></body></html>
